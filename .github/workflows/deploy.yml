name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FRAPPE_BRANCH: version-16
  # Pin to a specific frappe_docker commit/tag for build reproducibility.
  FRAPPE_DOCKER_REF: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage 1: build the stock frappe_docker layered image (Frappe +
      # ERPNext + HRMS + any custom apps from apps.json). This is
      # upstream's own build process, untouched.
      - name: Build layered Frappe/ERPNext/HRMS image
        run: |
          docker build \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }} \
            --secret=id=apps_json,src=${{ github.workspace }}/apps.json \
            --tag=frappe-layered:${{ github.sha }} \
            --file=frappe_docker/images/layered/Containerfile \
            frappe_docker

      # Stage 2: add our Procfile/scripts/nginx template/CHECKS on top.
      - name: Build deploy image
        run: |
          docker build \
            --build-arg=BASE_IMAGE=frappe-layered:${{ github.sha }} \
            --tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v16 \
            --tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --file=Dockerfile \
            .

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v16
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # NOTE: verify the exact input name for image-based deploys against
      # the current dokku/github-action README before relying on this —
      # action interfaces change. As of recent versions it accepts an image
      # reference for `git:from-image`-style deploys; confirm before use.
      - name: Deploy to Dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@YOUR_VPS_HOST:22/frappe'
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          deploy_docker_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
